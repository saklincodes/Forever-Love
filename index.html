<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fce8ef">
    <title>Forever Love ❤️ | Interactive 3D Romantic Memory Card</title>
    
    <!-- Meta Descriptions & SEO -->
    <meta name="description" content="A breathtaking, high-performance 3D interactive romantic memory card & slideshow built with vanilla JavaScript, custom CSS particle physics, and glassmorphism styling.">
    <meta name="keywords" content="Forever Love, Romantic Slideshow, 3D Web Animation, Canvas Particles, HTML5 Canvas, Saklin Codes, Frontend Showcase">
    <meta name="author" content="Saklin Codes">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://saklincodes.github.io/Forever-Love/">
    <meta property="og:title" content="Forever Love ❤️ | Interactive 3D Experience">
    <meta property="og:description" content="Immersive 3D photo scrapbook with dynamic particle engines, glassmorphism aesthetics, and celebration confetti.">
    <meta property="og:image" content="assets/images/slide-1.jpg">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Forever Love ❤️">
    <meta name="twitter:description" content="Interactive 3D romantic slideshow created with vanilla web technologies.">
    <meta name="twitter:image" content="assets/images/slide-1.jpg">

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Scripts -->
    <script src="assets/js/app.js" defer></script>
</head>
<body>

    <!-- Intro Splash Screen -->
    <div class="intro" id="intro" role="banner">
        <div class="intro-heart" aria-hidden="true">💕</div>
        <h1 class="intro-text">For you, with all my heart...</h1>
    </div>

    <!-- Animated Ambient Background Layer -->
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Particle Engine Canvas -->
    <canvas id="bgParts" aria-hidden="true"></canvas>

    <!-- 3D Slideshow Stage -->
    <main class="slideshow" id="ss" role="main" aria-live="polite"></main>

    <!-- UI Overlay Components -->
    <div class="pbar" id="pbar" style="width:0" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    <button class="rbtn" id="rbtn" aria-label="Replay Slideshow">Replay 💕</button>


</body>
</html>
